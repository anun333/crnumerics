# crnumerics (README.md): the checking kit's self-test and
# repro-scan's tests, on x86-64 and natively on arm64, where the kit's
# rounding is checked against the other ISA's hardware and repro-scan's
# x86 cases are cross-compiled. A cross compiler that cannot be installed
# only skips its cases, and says so. build/check.log is kept either way.
name: check
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  x86-64:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install MPFR, clang and the cross compilers
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libmpfr-dev clang libopenblas-dev   # OpenBLAS: crsum's check runs crgemm_oz through it
          for p in gcc-aarch64-linux-gnu libc6-dev-arm64-cross gcc-riscv64-linux-gnu libc6-dev-riscv64-cross qemu-user; do
            sudo apt-get install -y -qq $p || echo "no $p here: its repro-scan or repro-diff cases are skipped"
          done
      - name: CPU
        run: nproc; grep -m1 'model name' /proc/cpuinfo
      - name: make check
        run: make -j"$(nproc)" all && make check
      - name: repro-scan on glibc's libraries (a record; the verdicts don't fail the job)
        run: tools/repro-scan /usr/lib/x86_64-linux-gnu/libmvec.so.1 /usr/lib/x86_64-linux-gnu/libm.so.6 || true
      - name: Keep check.log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crnumerics-x86-64
          path: build/check.log
  ival:
    # ival's checks under AddressSanitizer, UndefinedBehaviorSanitizer and ThreadSanitizer, IEEE 1788's test suite
    # (ITF1788, from JuliaIntervals' copy of its itl files; mpmath for the proofs of its corrected tests), and the
    # Python binding against the system's NumPy
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install MPFR, mpmath, NumPy, pytest
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libmpfr-dev python3-mpmath python3-numpy python3-pytest
      - name: ival under ASan and UBSan
        run: make ival-sanitize
      - name: ival from eight threads under TSan
        run: make ival-thread-tsan
      - name: ITF1788
        run: |
          git clone -q --depth 1 https://github.com/JuliaIntervals/ITF1788.jl itf1788
          make -j"$(nproc)" build/libival.a build/libcrsum.a
          make itf1788-check ITF1788_ITL=itf1788/src/itl
      - name: The Python binding (ival/python)
        run: make -j"$(nproc)" ival-python-check
  macos:
    # ival on Apple Silicon with Apple clang: its checks (MPFR from Homebrew), ITF1788, the exports, the Python binding
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: MPFR, and NumPy, pytest and mpmath in a venv
        run: |
          brew install mpfr gmp
          python3 -m venv /tmp/v && /tmp/v/bin/pip install -q numpy pytest mpmath
      - name: CPU and compiler
        run: sysctl -n machdep.cpu.brand_string; clang --version | head -1
      - name: ival and its checks
        continue-on-error: true   # temporary, for the diagnosis below
        run: |
          P=$(brew --prefix)
          F="-O2 -I$P/include -L$P/lib"
          T="ival-check ival-arith-check ival-1788-check ival-rev-check ival-text-check ival-acc-check ival-thread-check ival-env-check ival-mode-change-check"
          make -j"$(sysctl -n hw.ncpu)" CC=clang CFLAGS="$F" build/libival.a build/libival.dylib $(for t in $T; do echo build/$t; done)
          for t in $T; do
            echo "== $t"
            out=$(build/$t 2>&1 | tail -3); echo "$out"
            echo "$out" | grep -q '^VERDICT: IDENTICAL' || { echo "$t did not pass"; exit 1; }
          done
      - name: Diagnosis (temporary)
        if: always()
        run: |
          clang -O2 -ffp-contract=off -frounding-math -o /tmp/both ival/test/diag/both.c && /tmp/both || true
          otool -tv build/ival/rev.o | grep -n -B8 -A2 fsqrt | head -60 || true
          python3 -c "import sys; s=open('ival/test/rev-check.c').read(); a='  if (!bad++) snprintf(first, sizeof first, \" (first: %s C'; assert s.count(a)==1; open('/tmp/rc.c','w').write(s.replace(a, '  fprintf(stderr, \"FAIL %s\\\\n\", op);\\n'+a))"
          grep -c 'FAIL %s' /tmp/rc.c
          P=$(brew --prefix)
          clang -O2 -ffp-contract=off -frounding-math -I ival -I$P/include -L$P/lib -o /tmp/rc /tmp/rc.c build/libival.a -lmpfr -lgmp -lm && /tmp/rc 2>/tmp/fails >/dev/null || true
          sort /tmp/fails | uniq -c
      - name: The library exports ival_ names only
        run: |
          nm -gU build/libival.dylib | awk '{print $3}' | sort > /tmp/exports
          wc -l < /tmp/exports
          ! grep -v '^_ival_' /tmp/exports
      - name: ITF1788
        run: |
          git clone -q --depth 1 https://github.com/JuliaIntervals/ITF1788.jl itf1788
          P=$(brew --prefix)
          make CC=clang CFLAGS="-O2 -I$P/include -L$P/lib" build/libcrsum.a
          PATH=/tmp/v/bin:$PATH make CC=clang CFLAGS="-O2 -I$P/include -L$P/lib" itf1788-check ITF1788_ITL=itf1788/src/itl
      - name: The Python binding
        run: PATH=/tmp/v/bin:$PATH make CC=clang ival-python-check
  arm64:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install MPFR, clang and the cross compilers
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libmpfr-dev clang libopenblas-dev   # OpenBLAS: crsum's check runs crgemm_oz through it
          sudo apt-get install -y -qq python3-numpy python3-pytest python3-mpmath   # ival's Python binding
          for p in gcc-x86-64-linux-gnu libc6-dev-amd64-cross gcc-riscv64-linux-gnu libc6-dev-riscv64-cross qemu-user; do
            sudo apt-get install -y -qq $p || echo "no $p here: its repro-scan or repro-diff cases are skipped"
          done
      - name: CPU
        run: nproc; lscpu | grep -E 'Model name|Vendor'
      - name: make check
        run: make -j"$(nproc)" all && make check
      - name: ival's Python binding on aarch64
        run: make ival-python-check
      - name: Keep check.log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crnumerics-arm64
          path: build/check.log
