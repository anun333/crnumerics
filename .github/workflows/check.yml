# crnumerics (README.md): the checking kit's self-test and
# repro-scan's tests, on x86-64 and natively on arm64, where the kit's
# rounding is checked against the other ISA's hardware and repro-scan's
# x86 cases are cross-compiled. A cross compiler that cannot be installed
# only skips its cases, and says so. build/check.log is kept either way.
name: check
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  crfix-mcu:   # crfix on 32-bit ARM without an FPU: Cortex-M0 bare metal and soft-float Linux under qemu, by digest
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install the ARM cross compilers and qemu
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc-arm-none-eabi libnewlib-arm-none-eabi gcc-arm-linux-gnueabi libc6-dev-armel-cross qemu-user qemu-system-arm
      - name: make crfix-cross-check
        run: |
          make crfix-cross-check | tee /tmp/cross.txt
          grep -q '^VERDICT: IDENTICAL' /tmp/cross.txt
  x86-64:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install MPFR, clang and the cross compilers
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libmpfr-dev clang libopenblas-dev   # OpenBLAS: crsum's check runs crgemm_oz through it
          for p in gcc-aarch64-linux-gnu libc6-dev-arm64-cross gcc-riscv64-linux-gnu libc6-dev-riscv64-cross qemu-user; do
            sudo apt-get install -y -qq $p || echo "no $p here: its repro-scan or repro-diff cases are skipped"
          done
      - name: CPU
        run: nproc; grep -m1 'model name' /proc/cpuinfo
      - name: make check
        run: make -j"$(nproc)" all && make check
      - name: repro-scan on glibc's libraries (a record; the verdicts don't fail the job)
        run: tools/repro-scan /usr/lib/x86_64-linux-gnu/libmvec.so.1 /usr/lib/x86_64-linux-gnu/libm.so.6 || true
      - name: Keep check.log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crnumerics-x86-64
          path: build/check.log
  ival:
    # ival's checks under AddressSanitizer, UndefinedBehaviorSanitizer and ThreadSanitizer, IEEE 1788's test suite
    # (ITF1788, from JuliaIntervals' copy of its itl files; mpmath for the proofs of its corrected tests), and the
    # Python binding against the system's NumPy
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install MPFR, mpmath, NumPy, pytest
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libmpfr-dev python3-mpmath python3-numpy python3-pytest
      - name: ival under ASan and UBSan
        run: make ival-sanitize
      - name: ival from eight threads under TSan
        run: make ival-thread-tsan
      - name: ITF1788
        run: |
          git clone -q --depth 1 https://github.com/JuliaIntervals/ITF1788.jl itf1788
          make -j"$(nproc)" build/libival.a build/libcrsum.a
          make itf1788-check ITF1788_ITL=itf1788/src/itl
      - name: The Python binding (ival/python)
        run: make -j"$(nproc)" ival-python-check
      - name: crdist's Python binding (dist/python)
        run: make -j"$(nproc)" crdist-python-check
      - name: crlin's Python binding (lin/python)
        run: make -j"$(nproc)" crlin-python-check
      - name: crfix's Python binding (fix/python)
        run: make -j"$(nproc)" crfix-python-check
  macos:
    # ival on Apple Silicon with Apple clang: its checks (MPFR from Homebrew), ITF1788, the exports, the Python binding;
    # and crdist's check (its samplers' fingerprints too) and binding
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: MPFR, and NumPy, pytest and mpmath in a venv
        run: |
          brew install mpfr gmp pkgconf
          python3 -m venv /tmp/v && /tmp/v/bin/pip install -q numpy pytest mpmath
      - name: CPU and compiler
        run: sysctl -n machdep.cpu.brand_string; clang --version | head -1
      - name: ival and its checks
        run: |
          P=$(brew --prefix)
          F="-O2 -I$P/include -L$P/lib"
          T="ival-check ival-arith-check ival-1788-check ival-rev-check ival-text-check ival-acc-check ival-thread-check ival-env-check ival-mode-change-check"
          make -j"$(sysctl -n hw.ncpu)" CC=clang CFLAGS="$F" build/libival.a build/libival.dylib $(for t in $T; do echo build/$t; done)
          for t in $T; do
            echo "== $t"
            out=$(build/$t 2>&1 | tail -3); echo "$out"
            echo "$out" | grep -q '^VERDICT: IDENTICAL' || { echo "$t did not pass"; exit 1; }
          done
      - name: make install, used through pkg-config (shared, static, C++)
        run: |
          P=$(brew --prefix)
          make CC=clang CXX=clang++ CFLAGS="-O2 -I$P/include -L$P/lib" ival-install-check | tail -1 | tee /tmp/install.txt
          grep -q '^VERDICT: IDENTICAL' /tmp/install.txt
          ls -l build/stage/usr/lib
      - name: The library exports ival_ names only
        run: |
          nm -gU build/libival.dylib | awk '{print $3}' | sort > /tmp/exports
          wc -l < /tmp/exports
          ! grep -v '^_ival_' /tmp/exports
      - name: ITF1788
        run: |
          git clone -q --depth 1 https://github.com/JuliaIntervals/ITF1788.jl itf1788
          P=$(brew --prefix)
          make CC=clang CFLAGS="-O2 -I$P/include -L$P/lib" build/libcrsum.a
          PATH=/tmp/v/bin:$PATH make CC=clang CFLAGS="-O2 -I$P/include -L$P/lib" itf1788-check ITF1788_ITL=itf1788/src/itl
      - name: The Python binding
        run: PATH=/tmp/v/bin:$PATH make CC=clang ival-python-check
      - name: crdist and its check (one thread, no OpenMP here)
        run: |
          P=$(brew --prefix)
          make -j"$(sysctl -n hw.ncpu)" CC=clang CFLAGS="-O2 -I$P/include -L$P/lib" build/libcrdist.dylib build/crdist-check
          build/crdist-check > /tmp/crdist.txt 2>&1; tail -3 /tmp/crdist.txt
          grep -q '^VERDICT: IDENTICAL' /tmp/crdist.txt
          nm -gU build/libcrdist.dylib | awk '{print $3}' | sort > /tmp/exports
          wc -l < /tmp/exports
          ! grep -v '^_crdist_' /tmp/exports
      - name: crdist's Python binding
        run: PATH=/tmp/v/bin:$PATH make CC=clang crdist-python-check
      - name: crlin and its check, and its binding
        run: |
          P=$(brew --prefix)
          make -j"$(sysctl -n hw.ncpu)" CC=clang CFLAGS="-O2 -I$P/include -L$P/lib" build/libcrlin.dylib build/crlin-check
          build/crlin-check > /tmp/crlin.txt 2>&1; tail -3 /tmp/crlin.txt
          grep -q '^VERDICT: IDENTICAL' /tmp/crlin.txt
          PATH=/tmp/v/bin:$PATH make CC=clang crlin-python-check
      - name: crfix and its check, native and portable 128-bit code
        run: |
          P=$(brew --prefix)
          make -j"$(sysctl -n hw.ncpu)" CC=clang CFLAGS="-O2 -I$P/include -L$P/lib" build/libcrfix.dylib build/crfix-check build/crfix-check-portable
          for c in crfix-check crfix-check-portable; do
            build/$c > /tmp/$c.txt 2>&1; tail -2 /tmp/$c.txt
            grep -q '^VERDICT: IDENTICAL' /tmp/$c.txt
          done
      - name: crfix's Python binding
        run: PATH=/tmp/v/bin:$PATH make CC=clang crfix-python-check
  arm64:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install MPFR, clang and the cross compilers
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libmpfr-dev clang libopenblas-dev   # OpenBLAS: crsum's check runs crgemm_oz through it
          sudo apt-get install -y -qq python3-numpy python3-pytest python3-mpmath   # ival's Python binding
          for p in gcc-x86-64-linux-gnu libc6-dev-amd64-cross gcc-riscv64-linux-gnu libc6-dev-riscv64-cross qemu-user; do
            sudo apt-get install -y -qq $p || echo "no $p here: its repro-scan or repro-diff cases are skipped"
          done
      - name: CPU
        run: nproc; lscpu | grep -E 'Model name|Vendor'
      - name: make check
        run: make -j"$(nproc)" all && make check
      - name: ival's Python binding on aarch64
        run: make ival-python-check
      - name: crdist's Python binding on aarch64
        run: make crdist-python-check
      - name: crlin's Python binding on aarch64
        run: make crlin-python-check
      - name: crfix's Python binding on aarch64
        run: make crfix-python-check
      - name: The kit self-test with fp16 (gcc 13 miscompiles __bf16 constants there; core-math/gcc13-bf16-fix.h)
        run: |
          gcc --version | head -1
          make -j"$(nproc)" B=build-fp16 CFLAGS="-O2 -march=armv8.2-a+fp16" build-fp16/selftest
          build-fp16/selftest | tail -1 | tee /dev/stderr | grep -q '^VERDICT: IDENTICAL'
      - name: Keep check.log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crnumerics-arm64
          path: build/check.log
