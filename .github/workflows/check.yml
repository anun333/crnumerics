# crnumerics (README.md): the checking kit's self-test and
# repro-scan's tests, on x86-64 and natively on arm64, where the kit's
# rounding is checked against the other ISA's hardware and repro-scan's
# x86 cases are cross-compiled. A cross compiler that cannot be installed
# only skips its cases, and says so. build/check.log is kept either way.
name: check
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  x86-64:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install MPFR, clang and the cross compilers
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libmpfr-dev clang libopenblas-dev   # OpenBLAS: crsum's check runs crgemm_oz through it
          for p in gcc-aarch64-linux-gnu libc6-dev-arm64-cross gcc-riscv64-linux-gnu libc6-dev-riscv64-cross qemu-user; do
            sudo apt-get install -y -qq $p || echo "no $p here: its repro-scan or repro-diff cases are skipped"
          done
      - name: CPU
        run: nproc; grep -m1 'model name' /proc/cpuinfo
      - name: make check
        run: make -j"$(nproc)" all && make check
      - name: repro-scan on glibc's libraries (a record; the verdicts don't fail the job)
        run: tools/repro-scan /usr/lib/x86_64-linux-gnu/libmvec.so.1 /usr/lib/x86_64-linux-gnu/libm.so.6 || true
      - name: Keep check.log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crnumerics-x86-64
          path: build/check.log
  ival:
    # ival's checks under AddressSanitizer, UndefinedBehaviorSanitizer and ThreadSanitizer, IEEE 1788's test suite
    # (ITF1788, from JuliaIntervals' copy of its itl files; mpmath for the proofs of its corrected tests), and the
    # Python binding against the system's NumPy
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install MPFR, mpmath, NumPy, pytest
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libmpfr-dev python3-mpmath python3-numpy python3-pytest
      - name: ival under ASan and UBSan
        run: make ival-sanitize
      - name: ival from eight threads under TSan
        run: make ival-thread-tsan
      - name: ITF1788
        run: |
          git clone -q --depth 1 https://github.com/JuliaIntervals/ITF1788.jl itf1788
          make -j"$(nproc)" build/libival.a build/libcrsum.a
          make itf1788-check ITF1788_ITL=itf1788/src/itl
      - name: The Python binding (ival/python)
        run: make -j"$(nproc)" ival-python-check
  arm64:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install MPFR, clang and the cross compilers
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libmpfr-dev clang libopenblas-dev   # OpenBLAS: crsum's check runs crgemm_oz through it
          for p in gcc-x86-64-linux-gnu libc6-dev-amd64-cross gcc-riscv64-linux-gnu libc6-dev-riscv64-cross qemu-user; do
            sudo apt-get install -y -qq $p || echo "no $p here: its repro-scan or repro-diff cases are skipped"
          done
      - name: CPU
        run: nproc; lscpu | grep -E 'Model name|Vendor'
      - name: make check
        run: make -j"$(nproc)" all && make check
      - name: Keep check.log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crnumerics-arm64
          path: build/check.log
