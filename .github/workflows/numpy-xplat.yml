name: numpy-xplat
# examples/numpy-xplat: NumPy 2.5.4's random draws and math functions, the same seed, on GitHub's hosted runners
# (Windows on x86-64 and Arm, Ubuntu on x86-64 and Arm). Each runner runs the script twice (the two reports must be
# equal) and uploads its report and the saved arrays. crdistr has no Windows wheel, so on Windows libcrdist is built
# here as a DLL by MSYS2's Clang, with the Makefile's flags, and crdistr comes from this checkout. Run by hand.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  run:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, windows-11-arm, ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: NumPy 2.5.4 from PyPI's wheels, and crdistr where it has one
        shell: bash
        run: |
          python -m pip install -q --only-binary=:all: numpy==2.5.4
          python -m pip install -q --only-binary=:all: crdistr==0.5.0 || echo "no crdistr wheel for this platform"
          python -c "import numpy, platform; print(numpy.__version__, platform.platform(), platform.machine())"
      - uses: msys2/setup-msys2@v2
        if: runner.os == 'Windows'
        with:
          msystem: ${{ matrix.os == 'windows-11-arm' && 'CLANGARM64' || 'CLANG64' }}
          update: false
          pacboy: clang:p
      - name: libcrdist as a DLL on Windows (the Makefile's -ffp-contract=off -frounding-math), crdistr from here
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          clang --version
          mkdir -p winlib
          # x86-64: -msse4.1 makes CORE-MATH's __builtin_roundeven an instruction; at baseline it is a call to libm's
          # roundeven, which glibc has and neither MinGW-w64 nor UCRT does (nor musl). An exact operation either way.
          x86=; [ "$MSYSTEM" = CLANG64 ] && x86=-msse4.1
          clang -O2 $x86 -ffp-contract=off -frounding-math -Wall -shared -o winlib/crdist.dll \
            dist/crdist.c dist/crdist16.c dist/crdist-sample.c \
            core-math/log/log.c core-math/log1p.c core-math/exp.c core-math/erfc.c
          { llvm-objdump -p winlib/crdist.dll || objdump -p winlib/crdist.dll; } 2>/dev/null | grep "DLL Name" \
            || echo "imports not listed (no objdump)"   # the system's only, or ctypes fails: it does not search PATH
          echo "CRDIST_LIBRARY=$(cygpath -w "$PWD/winlib/crdist.dll")" >> "$GITHUB_ENV"
      - name: crdistr from this checkout, on that DLL
        if: runner.os == 'Windows'
        shell: bash
        run: |
          python -m pip install -q ./dist/python
          python -c "import crdistr; print(crdistr.library_path, crdistr.version())"
      - name: Run twice
        shell: bash
        env:
          SAVE: "control.random,gen.uniform,gen.standard_gamma_2.5,gen.standard_normal,gen.standard_normal_f32,gen.standard_exponential_f32,gen.pareto_2.5,gen.standard_exponential_inv,gen.multivariate_normal_svd,gen.lognormal,gen.beta_0.3_2.2,gen.poisson_150,gen.binomial_2000_0.4,legacy.standard_normal,legacy.normal,legacy.poisson_150,libm.exp,libm.log,libm.pow,libm.expm1,ufunc.exp_f64,ufunc.log_f64,ufunc.sin_f64,ufunc.exp_f32"
        run: |
          python examples/numpy-xplat/numpy_xplat.py out1 --save "$SAVE"
          python examples/numpy-xplat/numpy_xplat.py out2
          cmp out1/report.json out2/report.json && echo "run1 = run2"
      - uses: actions/upload-artifact@v4
        with:
          name: numpy-xplat-${{ matrix.os }}
          path: out1
