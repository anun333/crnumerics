[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "crlin"
version = "0.10.0"
description = "Verified linear algebra over NumPy arrays: enclosures of exact solutions (dense, banded and sparse systems, interval data, least squares, very ill-conditioned systems) and of symmetric eigenvalues, and proofs of positive definiteness; safe with a threaded BLAS; on crnumerics' libcrlin"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.8"
dependencies = ["numpy"]
keywords = ["verified computing", "linear algebra", "linear systems", "least squares", "eigenvalues", "interval arithmetic", "reproducibility"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: C",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Mathematics",
]

[project.urls]
Homepage = "https://anun333.github.io/crnumerics/"
Changelog = "https://github.com/anun333/crnumerics/blob/main/HISTORY.md"
Source = "https://github.com/anun333/crnumerics/tree/main/lin"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
crlin = ["libcrlin.so.0", "libcrlin.0.dylib", "LICENSE"]   # present only in a wheel from build-wheel.sh
