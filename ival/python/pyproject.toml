[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "crival"   # on PyPI; the module is ival (import ival)
version = "0.8.0"
description = "Tight IEEE 1788.1 interval arithmetic over NumPy arrays, on crnumerics' libival (CORE-MATH's correctly rounded functions)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"   # math.nextafter
dependencies = ["numpy"]
keywords = ["interval arithmetic", "IEEE 1788", "verified computing", "correct rounding", "floating point", "reproducibility"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: C",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Mathematics",
]

[project.urls]
Homepage = "https://anun333.github.io/crnumerics/"
Changelog = "https://github.com/anun333/crnumerics/blob/main/HISTORY.md"
Source = "https://github.com/anun333/crnumerics/tree/main/ival"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ival = ["libival.so.0", "libival.0.dylib", "LICENSE", "LICENSE-CORE-MATH"]   # present only in a wheel from build-wheel.sh
