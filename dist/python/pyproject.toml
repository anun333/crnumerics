[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "crdistr"   # on PyPI and as the module (import crdistr); "crdist" there is an unrelated project
version = "0.10.0"
description = "The normal distribution over NumPy arrays, correctly rounded in binary32, binary16 and bfloat16 (erfinv, erfcinv, probit, ndtr, log_ndtr, normpdf, logit), and samplers with the same bits on every machine; on crnumerics' libcrdist"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.8"
dependencies = ["numpy"]
keywords = ["normal distribution", "erfinv", "probit", "ndtri", "correct rounding", "random sampling", "bfloat16", "reproducibility"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: C",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Mathematics",
]

[project.urls]
Homepage = "https://anun333.github.io/crnumerics/"
Changelog = "https://github.com/anun333/crnumerics/blob/main/HISTORY.md"
Source = "https://github.com/anun333/crnumerics/tree/main/dist"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
crdistr = ["libcrdist.so.0", "libcrdist.0.dylib", "LICENSE", "LICENSE-CORE-MATH"]   # present only in a wheel from build-wheel.sh
